
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: 25px auto;
    background: #121c30;
    padding: 25px;
    border-radius: 18px;
    border: 1px solid #263b5e;
    box-shadow: 0 0 25px #0066ff22;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    color: #38a5ff;
    font-size: 32px;
}

header p {
    color: #aabbd5;
    margin-top: 10px;
}

label {
    display: block;
    margin: 17px 0 8px;
    color: #d8e7ff;
}

select, button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: none;
    font-size: 16px;
}

select {
    background: #202e48;
    color: white;
    border: 1px solid #405879;
}

button {
    background: #087cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
    transition: .2s;
}

button:hover {
    background: #0056c9;
}

button:disabled {
    background: #52647e;
    cursor: not-allowed;
}

#quizBox, #resultBox {
    display: none;
}

.top-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: #62b6ff;
    margin: 20px 0;
}

.question {
    font-size: 21px;
    line-height: 1.5;
    margin: 20px 0;
}

.option {
    display: block;
    padding: 14px;
    margin: 12px 0;
    background: #202e48;
    border: 1px solid #405879;
    border-radius: 10px;
    cursor: pointer;
}

.option:hover {
    background: #29466c;
}

.option.selected {
    background: #0757a9;
    border-color: #38a5ff;
}

.option.correct {
    background: #176b42;
}

.option.wrong {
    background: #8a2735;
}

#feedback {
    margin-top: 15px;
    line-height: 1.5;
    color: #9ee4b8;
}

#resultBox {
    text-align: center;
}

#score {
    font-size: 45px;
    color: #38a5ff;
    margin: 20px;
}

.small {
    color: #aabbd5;
    margin-top: 15px;
}

@media(max-width:500px) {
    .container {
        padding: 18px;
    }
    header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🤖 AI Quiz Generator</h1>
    <p>Learn Anything • Test Your Knowledge</p>
</header>

<div id="setupBox">

    <h2>Start Your Quiz</h2>

    <label>Select Subject</label>
    <select id="subject">
        <option value="Science">Science</option>
        <option value="Maths">Mathematics</option>
        <option value="English">English</option>
        <option value="GK">General Knowledge</option>
        <option value="Computer">Computer</option>
        <option value="History">History</option>
        <option value="Geography">Geography</option>
        <option value="Biology">Biology</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
    </select>

    <label>Select Difficulty</label>
    <select id="difficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
    </select>

    <label>Number of Questions</label>
    <select id="total">
        <option value="5">5 Questions</option>
        <option value="10" selected>10 Questions</option>
        <option value="15">15 Questions</option>
    </select>

    <button onclick="startQuiz()">🚀 Generate Quiz</button>

</div>

<div id="quizBox">

    <div class="top-info">
        <span id="progress">Question 1</span>
        <span id="scoreLive">Score: 0</span>
    </div>

    <h3 id="question" class="question"></h3>

    <div id="options"></div>

    <p id="feedback"></p>

    <button id="nextBtn" onclick="nextQuestion()" disabled>
        Next Question →
    </button>

</div>

<div id="resultBox">

    <h2>🎉 Quiz Completed!</h2>

    <div id="score"></div>

    <h3 id="message"></h3>

    <p id="details" class="small"></p>

    <button onclick="location.reload()">
        🔄 Play Again
    </button>

</div>

</div>

<script>

// QUESTION DATABASE

const questions = {

Science: [
["Which planet is known as the Red Planet?",["Earth","Mars","Jupiter","Venus"],1],
["Which gas do plants absorb?",["Oxygen","Nitrogen","Carbon Dioxide","Hydrogen"],2],
["What is the boiling point of water?",["50°C","100°C","150°C","200°C"],1],
["Which organ pumps blood?",["Brain","Lungs","Heart","Kidney"],2],
["What is H2O?",["Oxygen","Water","Salt","Hydrogen"],1],
["Which force pulls objects toward Earth?",["Magnetism","Gravity","Friction","Electricity"],1],
["What is the center of an atom called?",["Nucleus","Cell","Electron","Molecule"],0],
["Which vitamin comes from sunlight?",["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],3],
["Which gas do humans breathe in?",["Oxygen","Carbon dioxide","Helium","Methane"],0],
["What is the nearest star to Earth?",["Sirius","Sun","Polaris","Vega"],1]
],

Maths: [
["What is 12 × 8?",["86","96","106","108"],1],
["What is 100 divided by 4?",["20","25","30","40"],1],
["What is the square of 9?",["18","72","81","99"],2],
["What is 15 + 25?",["30","35","40","45"],2],
["What is 7 × 7?",["42","48","49","56"],2],
["What is 144 divided by 12?",["10","11","12","14"],2],
["What is half of 80?",["20","30","40","50"],2],
["What is 20% of 100?",["10","20","30","40"],1],
["How many sides does a triangle have?",["2","3","4","5"],1],
["What is 5 cubed?",["25","75","100","125"],3]
],

English: [
["What is the plural of Child?",["Childs","Children","Childes","Childrens"],1],
["Choose the correct spelling.",["Apple","Aple","Appel","Appl"],0],
["What is the opposite of Hot?",["Warm","Cold","Heat","Fire"],1],
["What is the past tense of Go?",["Goed","Going","Went","Goes"],2],
["Which is a noun?",["Run","Beautiful","School","Quickly"],2],
["What is the opposite of Happy?",["Glad","Sad","Joy","Smile"],1],
["Which is a vowel?",["B","C","E","D"],2],
["What is the plural of Book?",["Bookes","Books","Bookies","Book"],1],
["Choose the correct article: ___ Apple",["A","An","Thee","No article"],1],
["What is the synonym of Big?",["Small","Tiny","Large","Short"],2]
],

GK: [
["What is the capital of India?",["Mumbai","Delhi","Kolkata","Chennai"],1],
["Which is the largest ocean?",["Indian","Atlantic","Pacific","Arctic"],2],
["How many days are in a week?",["5","6","7","8"],2],
["Which is the national animal of India?",["Lion","Tiger","Elephant","Deer"],1],
["Which planet is largest?",["Earth","Mars","Jupiter","Mercury"],2],
["What is the currency of Japan?",["Dollar","Yen","Euro","Rupee"],1],
["Which is the tallest mountain?",["K2","Everest","Kilimanjaro","Alps"],1],
["How many colours are in a rainbow?",["5","6","7","8"],2],
["Which country is famous for the Eiffel Tower?",["Italy","France","Japan","India"],1],
["Which is the largest continent?",["Africa","Europe","Asia","Australia"],2]
],

Computer: [
["What is the brain of a computer?",["Mouse","CPU","Keyboard","Monitor"],1],
["What does HTML stand for?",["Hyper Text Markup Language","High Text Machine Language","Hyper Tool Mark Language","Home Text Markup Language"],0],
["Which device is used to type?",["Mouse","Monitor","Keyboard","Speaker"],2],
["What is the full form of CPU?",["Central Processing Unit","Computer Personal Unit","Central Program Utility","Control Processing User"],0],
["Which one is an operating system?",["Windows","HTML","Google","CPU"],0],
["What is used to browse websites?",["Browser","Calculator","Paint","Notepad"],0],
["Which is an input device?",["Monitor","Printer","Mouse","Speaker"],2],
["What is 1 KB approximately?",["100 bytes","1024 bytes","10 bytes","10000 bytes"],1],
["Which symbol is used for email?",["#","@","&","%"],1],
["Which language is used for web page styling?",["HTML","CSS","SQL","C"],1]
],

History: [
["Who was the first Mughal emperor in India?",["Akbar","Babur","Shah Jahan","Humayun"],1],
["In which year did India become independent?",["1945","1946","1947","1950"],2],
["Who is known as the Father of the Nation in India?",["Jawaharlal Nehru","Mahatma Gandhi","Sardar Patel","B. R. Ambedkar"],1],
["Who built the Taj Mahal?",["Akbar","Babur","Shah Jahan","Aurangzeb"],2],
["Who was the first Prime Minister of India?",["Rajendra Prasad","Jawaharlal Nehru","Sardar Patel","Lal Bahadur Shastri"],1]
],

Geography: [
["Which is the largest continent?",["Europe","Asia","Africa","Australia"],1],
["Which is the longest river traditionally identified in Africa?",["Nile","Amazon","Ganga","Yangtze"],0],
["Which is the largest hot desert?",["Thar","Sahara","Gobi","Kalahari"],1],
["How many continents are there?",["5","6","7","8"],2],
["Which planet is called the Blue Planet?",["Mars","Earth","Venus","Jupiter"],1]
],

Biology: [
["What is the basic unit of life?",["Tissue","Cell","Organ","Atom"],1],
["Which organ helps us breathe?",["Heart","Lungs","Liver","Kidney"],1],
["Which part of a plant absorbs water?",["Flower","Root","Fruit","Leaf"],1],
["Which blood cells carry oxygen?",["White cells","Red cells","Platelets","Plasma"],1],
["What is the green pigment in plants?",["Chlorophyll","Melanin","Keratin","Haemoglobin"],0]
],

Physics: [
["What is the SI unit of force?",["Joule","Newton","Watt","Pascal"],1],
["What is the speed of light approximately?",["300,000 km/s","30 km/s","3,000 km/s","30,000 km/s"],0],
["Which instrument measures temperature?",["Barometer","Thermometer","Ammeter","Voltmeter"],1],
["What is the SI unit of energy?",["Watt","Joule","Newton","Metre"],1],
["Sound travels fastest in which?",["Vacuum","Air","Water","Solids"],3]
],

Chemistry: [
["What is the chemical symbol of Gold?",["Ag","Au","Fe","Go"],1],
["What is the pH of neutral pure water at 25°C?",["0","5","7","14"],2],
["Which gas is needed for combustion?",["Oxygen","Nitrogen","Helium","Carbon dioxide"],0],
["What is the chemical symbol of Sodium?",["S","Na","So","N"],1],
["Which is a noble gas?",["Oxygen","Hydrogen","Neon","Nitrogen"],2]
]

};

let quiz = [];
let current = 0;
let score = 0;
let answered = false;
let total = 10;

// START QUIZ

function startQuiz() {

    let subject = document.getElementById("subject").value;

    let difficulty = document.getElementById("difficulty").value;

    total = Number(document.getElementById("total").value);

    quiz = [...questions[subject]];

    // Shuffle questions
    quiz.sort(() => Math.random() - 0.5);

    quiz = quiz.slice(0, Math.min(total, quiz.length));

    current = 0;
    score = 0;

    document.getElementById("setupBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    showQuestion();

}

// SHOW QUESTION

function showQuestion() {

    answered = false;

    let q = quiz[current];

    document.getElementById("progress").innerText =
        "Question " + (current + 1) + " / " + quiz.length;

    document.getElementById("scoreLive").innerText =
        "Score: " + score;

    document.getElementById("question").innerText = q[0];

    document.getElementById("feedback").innerText = "";

    document.getElementById("nextBtn").disabled = true;

    let options = document.getElementById("options");

    options.innerHTML = "";

    q[1].forEach((option, index) => {

        let btn = document.createElement("div");

        btn.className = "option";
        btn.innerText = option;

        btn.onclick = () => checkAnswer(index, btn);

        options.appendChild(btn);

    });

}

// CHECK ANSWER

function checkAnswer(index, selected) {

    if (answered) return;

    answered = true;

    let correct = quiz[current][2];

    let all = document.querySelectorAll(".option");

    all.forEach((btn, i) => {

        if (i === correct) {
            btn.classList.add("correct");
        }

        if (i === index && index !== correct) {
            btn.classList.add("wrong");
        }

    });

    if (index === correct) {

        score++;

        document.getElementById("feedback").innerText =
            "✅ Excellent! Your answer is correct.";

    } else {

        document.getElementById("feedback").innerText =
            "❌ Wrong Answer! Correct Answer: " + quiz[current][1][correct];

    }

    document.getElementById("scoreLive").innerText =
        "Score: " + score;

    document.getElementById("nextBtn").disabled = false;

}

// NEXT QUESTION

function nextQuestion() {

    current++;

    if (current < quiz.length) {

        showQuestion();

    } else {

        showResult();

    }

}

// RESULT

function showResult() {

    document.getElementById("quizBox").style.display = "none";

    document.getElementById("resultBox").style.display = "block";

    document.getElementById("score").innerText =
        score + " / " + quiz.length;

    let percentage = Math.round(score / quiz.length * 100);

    let message = "";

    if (percentage >= 80) {
        message = "🏆 Excellent! Amazing Work!";
    } else if (percentage >= 50) {
        message = "👏 Good Job! Keep Practicing!";
    } else {
        message = "💪 Keep Learning! Try Again!";
    }

    document.getElementById("message").innerText = message;

    document.getElementById("details").innerText =
        "You answered " + score + " questions correctly out of " +
        quiz.length + ". Your score is " + percentage + "%.";

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi AI Quiz Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#080d18;color:white;
  min-height:100vh;display:flex;
  justify-content:center;align-items:center;padding:15px
}
.app{
  width:100%;max-width:750px;height:90vh;
  background:#131d30;border:1px solid #293957;
  border-radius:18px;display:flex;flex-direction:column;
  overflow:hidden
}
header{
  background:#1b2b47;padding:18px;text-align:center;
  border-bottom:1px solid #34445d
}
header h2{margin:0;color:#38bdf8}
header p{margin:7px 0 0;color:#cbd5e1;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:18px}
.msg{
  padding:12px 15px;margin:10px 0;
  border-radius:14px;max-width:85%;
  line-height:1.6;white-space:pre-wrap
}
.ai{background:#263852;margin-right:auto}
.user{background:#075985;margin-left:auto}
#status{padding:5px 15px;color:#94a3b8;font-size:12px}
.controls{
  display:flex;gap:8px;padding:12px;
  background:#1b2b47
}
input{
  flex:1;min-width:0;padding:14px;
  border:1px solid #475569;border-radius:10px;
  background:#0f172a;color:white;font-size:15px;
  outline:none
}
button{
  border:0;border-radius:10px;padding:12px 17px;
  background:#0284c7;color:white;font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#start{margin:0 15px 12px;background:#16a34a}
</style>
</head>
<body>
<div class="app">
  <header>
    <h2>🤖 Hindi AI Quiz Generator</h2>
    <p>हिंदी में सवालों के जवाब दें और अपना ज्ञान बढ़ाएँ</p>
  </header>

  <div id="chat">
    <div class="msg ai">
      नमस्ते! मैं आपका AI Quiz Teacher हूँ।
      नीचे Start Quiz दबाएँ और अपना विषय चुनें।
    </div>
  </div>

  <div id="status">तैयार है</div>
  <button id="start" onclick="startQuiz()">▶ Start Quiz</button>

  <div class="controls">
    <input id="answer" placeholder="अपना जवाब हिंदी में लिखें..."
           onkeydown="if(event.key==='Enter')sendAnswer()">
    <button id="send" onclick="sendAnswer()">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("answer");
const sendBtn = document.getElementById("send");
const statusText = document.getElementById("status");

let history = [];
let busy = false;

function addMessage(text, who){
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function askAI(message){
  if(busy) return;
  busy = true;
  sendBtn.disabled = true;
  statusText.textContent = "AI जवाब तैयार कर रहा है...";

  history.push({role:"user", parts:[{text:message}]});

  try{
    const response = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({history})
    });

    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Server error");

    const reply = data.reply || "मुझे जवाब नहीं मिला।";
    history.push({role:"model",parts:[{text:reply}]});
    addMessage(reply,"ai");
    statusText.textContent = "आपकी बारी है!";
  }catch(error){
    history.pop();
    addMessage("कनेक्शन में समस्या: " + error.message,"ai");
    statusText.textContent = "कनेक्शन नहीं हो पाया";
  }finally{
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function startQuiz(){
  history = [];
  chat.innerHTML = "";
  const subject = prompt(
    "किस विषय का Quiz खेलना चाहते हैं?\nजैसे: Science, Maths, History, Geography, GK"
  );
  if(!subject || !subject.trim()) return;

  addMessage("मेरा विषय: " + subject,"user");
  askAI(
    "मुझे " + subject +
    " विषय पर हिंदी में 10 सवालों का Quiz खिलाइए। " +
    "एक बार में केवल एक सवाल पूछिए। पहला सवाल अभी पूछिए। " +
    "मेरे जवाब को समझकर सही या गलत बताइए, छोटा कारण समझाइए, " +
    "फिर अगला सवाल पूछिए। मेरे स्कोर का हिसाब रखिए। " +
    "10 सवाल पूरे होने पर कुल स्कोर और परिणाम बताइए। " +
    "पूरी बातचीत हिंदी में रखिए।"
  );
}

function sendAnswer(){
  const text = input.value.trim();
  if(!text || busy) return;
  input.value = "";
  addMessage(text,"user");
  askAI(text);
}
</script>
</body>
</html>
